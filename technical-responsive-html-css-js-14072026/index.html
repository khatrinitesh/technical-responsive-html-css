<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Technical 14072026 - HTML+CSS+JS</title>
    <link type="text/css" rel="stylesheet" href="css/custom.css">
</head>

<body>
    <!-- dynamic viewport height -->
    <section class="full-screen-section">
        <h1>Full-screen responsive section</h1>
    </section>

    <!-- better heading wrapping -->
    <h1 class="heading">
        Build better digital experiences for every screen
    </h1>

    <!--  Responsive Font Sizes -->
    <h1 class="heading2">Responsive Main Heading</h1>
    <h2 class="subheading">Responsive Subheading</h2>
    <p class="paragraph">
        This text automatically adjusts according to the screen width.
    </p>

    <!-- Gradient Text Effect -->
    <h1 class="animated-gradient-text">
        Animated Gradient Text
    </h1>

    <!-- Scroll-Driven Animation -->
    <section class="spacer">
        <h1>Scroll down</h1>
    </section>

    <section class="animation-section">
        <div class="scroll-card">
            Scroll-driven animation
        </div>
    </section>

    <section class="spacer"></section>

    <div class="scroll-progress"></div>

    <!--  Auto Responsive CSS Gri -->
    <div class="card-grid">
        <article class="card">Card 1</article>
        <article class="card">Card 2</article>
        <article class="card">Card 3</article>
        <article class="card">Card 4</article>
        <article class="card">Card 5</article>
        <article class="card">Card 6</article>
    </div>

    <!-- Perfect Images with aspect-ratio -->
    <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Mountain landscape" />
    </div>

    <!-- Neumorphism Shadow -->
    <button class="neumorphic-button">
        Click Me
    </button>
</body>

</html>
